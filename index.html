<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HarvestLens AI - Agricultural Intelligence & Ripeness Detection Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#193D2B;--lf:#527A43;--v:#B9D98B;--w:#F8F6ED;--y:#E7B955;--bg:#F8F6ED;--card:#fff;--tx:#27332A;--mu:#5f6d5f;--bd:#E7EEDF;--eb:#8A6546;--sh:0 6px 24px rgba(25,61,43,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f18;--card:#12332a;--tx:#eef4ec;--mu:#9db3a8;--bd:#1f4a3d;--sh:0 8px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b1f18;--card:#12332a;--tx:#eef4ec;--mu:#9db3a8;--bd:#1f4a3d;--sh:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,Inter,system-ui,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* Top Horizontal Bar */
.top-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);color:var(--tx);border-bottom:1px solid var(--bd);height:64px}
.top-bar-inner{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 24px;max-width:100%}
.top-bar-right{display:flex;align-items:center;gap:12px}
.logo{color:var(--tx);font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:22px;white-space:nowrap;display:flex;gap:8px;align-items:center;background:none;border:0;cursor:pointer}
.menu-toggle{display:none;background:none;border:0;color:var(--tx);cursor:pointer;padding:6px;border-radius:8px}
.menu-toggle:hover{background:var(--bd)}

/* App Shell & Vertical Left Sidebar */
.app-layout{min-height:100vh;display:flex;flex-direction:column}
.app-shell{display:flex;flex:1;position:relative}
.sidebar{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px;z-index:40;transition:transform .25s ease}
.sidebar-head{padding:4px 12px 10px;margin-bottom:4px}
.sidebar-nav{display:flex;flex-direction:column;gap:5px;flex:1}
.sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mu);text-decoration:none;font-weight:600;font-size:14px;transition:background .15s,color .15s,transform .1s;cursor:pointer}
.sidebar-link:hover{background:var(--bd);color:var(--tx)}
.sidebar-link.on{background:var(--g);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(25,61,43,.2)}
.sidebar-link.on svg{stroke:var(--y)}
.sidebar-footer{padding-top:14px;border-top:1px solid var(--bd);margin-top:12px}
.app-main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.app-main-wrap main{flex:1}
.sidebar-backdrop{display:none}

@media(max-width:880px){
 .menu-toggle{display:inline-flex;align-items:center;justify-content:center}
 .sidebar{position:fixed;top:64px;bottom:0;left:0;width:260px;height:calc(100vh - 64px);transform:translateX(-100%);box-shadow:0 8px 30px rgba(0,0,0,.25)}
 .sidebar.open{transform:translateX(0)}
 .sidebar-backdrop{display:block;position:fixed;inset:64px 0 0 0;background:rgba(11,31,24,.45);backdrop-filter:blur(2px);z-index:35}
}
.btn{border:0;border-radius:99px;padding:12px 22px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(53,216,121,.35)}.btn:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--v);color:var(--g)}.gold{background:var(--y);color:var(--g)}.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.dk{background:var(--g);color:#fff}.dk:hover:not(:disabled){box-shadow:0 8px 20px rgba(25,61,43,.3)}
section.pg{padding:40px 0 70px;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
h2{font-size:clamp(26px,4vw,38px);margin:0 0 6px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:20px}
.studio{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px}
@media(max-width:880px){.studio{grid-template-columns:1fr}}
.stage{position:relative;background:#0b1f18;border-radius:20px;min-height:340px;display:grid;place-items:center;overflow:hidden;color:#9db3a8;text-align:center}
.stage img,.stage video{max-width:100%;max-height:520px;display:block}
.imgbox{position:relative;display:inline-block;line-height:0}
.box{position:absolute;border:2.5px solid var(--v);border-radius:6px;transition:.3s;pointer-events:none}
.box span{position:absolute;left:-2px;top:-24px;background:var(--v);color:var(--g);font:800 11px/1 Manrope;padding:5px 7px;border-radius:6px;white-space:nowrap}
.box.demo{border-style:dashed;border-color:var(--y)}.box.demo span{background:var(--y)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.ban{padding:12px 14px;border-radius:14px;font-size:14px;margin-top:12px}
.warn{background:#fff3d1;color:#5b4300}.err{background:#fde1df;color:#7a1410}.ok{background:#d9f7e5;color:#0b4a28}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--v);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.res{padding:12px;border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--v);border-radius:9px;transition:width .6s}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;display:inline-block}
.t-Unripe{background:#dff6c8;color:#2d5a0c}.t-Ripe{background:#d3f7e1;color:#0b5b2f}.t-Overripe{background:#ffe9b0;color:#6b4a00}.t-Rotten{background:#e9dccd;color:#4a2f17}
.s-Monitoring{background:var(--v);color:#193D2B}.s-Inspection{background:var(--y);color:#27332A}.s-Needs{background:#fde1df;color:#7a1410}.s-Completed{background:#ddd;color:#333}
.demoTag{background:var(--y);color:var(--g)}.realTag{background:var(--v);color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:20px}
.fc{transition:transform .2s,box-shadow .2s}.fc:hover{transform:translateY(-4px)}
.art{border-radius:16px;display:grid;place-items:center;height:150px;margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.pill{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
.pill[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:20px}
.hb{display:grid;grid-template-columns:90px 1fr 36px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.empty{padding:30px;text-align:center;color:var(--mu);border:2px dashed var(--bd);border-radius:18px}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=date],select,textarea{border:1.5px solid var(--bd);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--tx);width:100%}
ol.flow{counter-reset:s;padding:0;list-style:none;display:grid;gap:12px}
ol.flow li{counter-increment:s;padding-left:46px;position:relative}
ol.flow li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--v);color:var(--g);display:grid;place-items:center;font-weight:800}
footer{background:var(--g);color:#9db3a8;padding:24px 0;font-size:13px}
.hero2{background:radial-gradient(700px 380px at 90% 10%,rgba(231,185,85,.28),transparent),radial-gradient(600px 400px at 0 100%,var(--bd),transparent);padding:56px 0 30px}
.hh{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
.hero2 h1{font-size:clamp(38px,5.6vw,68px);line-height:1.04;margin:16px 0}.hero2 h1 em{color:var(--lf)}
.hero2 p{max-width:520px;color:var(--mu);font-size:18px}
.eyebrow{display:inline-flex;gap:6px;align-items:center;background:var(--bd);color:var(--tx);font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px;letter-spacing:.03em}
.orchw{position:relative}.orch{border-radius:28px 28px 120px 28px;overflow:hidden;border:1px solid var(--bd);aspect-ratio:5/4.4}
.orch svg{width:100%;height:100%;display:block}
.fl{position:absolute;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:16px;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.fr{position:absolute;border:2px dashed var(--y);border-radius:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:34px}
.strip div{background:var(--g);color:#fff;border-radius:20px;padding:18px}.strip b{font:400 36px 'DM Serif Display',serif;display:block;color:var(--y)}.strip span{font-size:13px;color:#cfe0c6}
@media(max-width:880px){.hh{grid-template-columns:1fr}}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.sum .card{background:var(--bd);box-shadow:none}.sum b{font:400 38px 'DM Serif Display',serif;display:block}
.f{display:grid;gap:4px;font-size:13px;font-weight:700}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}
.thumb{width:100%;height:150px;object-fit:cover;border-radius:16px;margin-bottom:10px;background:var(--bd);display:grid;place-items:center}
.tl{border-left:3px solid var(--bd);margin-left:10px;padding-left:22px;display:grid;gap:18px}
.tl>div{position:relative}.tl>div:before{content:"";position:absolute;left:-30px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--lf);border:3px solid var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.steps{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.steps span{padding:6px 14px;border-radius:99px;background:var(--bd);font-size:13px;font-weight:800}.steps .on{background:var(--g);color:#fff}
.fpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}.fpick button{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:6px;cursor:pointer;font-weight:700;font-size:12px}.fpick button[aria-pressed=true]{border-color:var(--lf);background:var(--bd)}
.fab{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;padding:0;z-index:30;box-shadow:0 8px 24px rgba(25,61,43,.35)}
@media(max-width:880px){.fab{display:inline-flex}}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,24,.6);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:24px;border:1px solid var(--bd);box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:480px;padding:26px;max-height:90vh;overflow-y:auto}
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding:10px;background:var(--bd);border-radius:14px;margin:10px 0}
.chat-msg{padding:8px 12px;border-radius:12px;max-width:80%;font-size:13px}
.chat-msg.mine{align-self:flex-end;background:var(--g);color:#fff}
.chat-msg.theirs{align-self:flex-start;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

<script>
const {useState, useEffect, useRef, useMemo, useCallback} = React;
const html = htm.bind(React.createElement);

const STAGES = ['Unripe', 'Ripe', 'Overripe', 'Rotten'];
const FRUITS = {
 Apple:{c:['#9bd05a','#d6303a','#a8222c','#5a3a22'],cue:'Ripe apples show deep, even colour and separate easily from the branch.'},
 Banana:{c:['#9bc548','#ffd23f','#d9a21e','#4a3320'],cue:'Green-tipped fruit is unripe; brown speckling marks the overripe stage.'},
 Grape:{c:['#a8cf6a','#6b2f8f','#4c1d6b','#3a2a2a'],cue:'Ripe grapes are plump and firmly attached; shrivelled berries are past peak.'},
 Mango:{c:['#8fc04a','#f5a623','#d9741a','#4f3321'],cue:'A sweet aroma near the stem and slight give signal ripeness.'},
 Melon:{c:['#a8d08a','#e8c97a','#c9a24f','#5c4a30'],cue:'Ripe melons smell fragrant at the blossom end and sound hollow when tapped.'},
 Orange:{c:['#a6cc4f','#ff9a1f','#e0701a','#5a3a1c'],cue:'Heavy-for-size fruit with glossy, slightly soft skin is usually at peak.'},
 Peach:{c:['#b6d27a','#ffb27a','#e07b4f','#59372a'],cue:'Fragrant fruit that yields slightly near the stem is ripe.'},
 Pear:{c:['#a9cf63','#d6d85a','#b99a3a','#4f3a22'],cue:'Pears ripen after picking; check for gentle give near the neck.'}
};
const MAT = {
 Unripe:['Not ready to harvest. Allow more time on the plant.','Firm, green and low in sugar.'],
 Ripe:['Ready for harvest at best flavour.','Full colour, aromatic, balanced sweetness.'],
 Overripe:['Harvest or use soon; best for processing.','Soft, very sweet, shorter shelf life.'],
 Rotten:['Not suitable for sale. Remove to limit spread.','Mould, leaking or dark decay present.']
};
const FN = Object.keys(FRUITS);

function parseLabel(l){
 const s = String(l).toLowerCase();
 const f = FN.find(x => s.includes(x.toLowerCase()));
 const m = STAGES.find(x => s.includes(x.toLowerCase()));
 return {fruit: f || 'Unknown', maturity: m || 'Unknown'};
}

/* =========================================================================
   Live Backend API Client (Zero-Configuration, CORS & JWT enabled)
   ========================================================================= */
const API = {
 base: () => {
   try {
     const stored = localStorage.getItem('hl_api');
     if (stored) return stored;
     if (window.location.origin && window.location.origin.startsWith('http')) {
       return window.location.origin;
     }
     return 'http://localhost:8000';
   } catch (e) {
     return 'http://localhost:8000';
   }
 },
 setBase: (u) => {
   try { localStorage.setItem('hl_api', u.trim()); } catch(e){}
 },
 getToken: () => {
   try { return localStorage.getItem('hl_jwt') || ''; } catch(e){ return ''; }
 },
 setToken: (t) => {
   try { if(t) localStorage.setItem('hl_jwt', t); else localStorage.removeItem('hl_jwt'); } catch(e){}
 },
 async req(endpoint, opts = {}) {
   const headers = opts.headers || {};
   const token = this.getToken();
   if (token && !headers['Authorization']) {
     headers['Authorization'] = 'Bearer ' + token;
   }
   if (!(opts.body instanceof FormData) && !headers['Content-Type']) {
     headers['Content-Type'] = 'application/json';
   }
   const res = await fetch(this.base() + endpoint, {...opts, headers});
   if (!res.ok) {
     let errMsg = 'API Error (' + res.status + ')';
     try {
       const j = await res.json();
       if (j.detail) errMsg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail);
     } catch(e){}
     throw new Error(errMsg);
   }
   return res.json();
 },
 async health() {
   const r = await fetch(this.base() + '/api/health', {signal: AbortSignal.timeout(4000)});
   if (!r.ok) throw new Error('Health check returned ' + r.status);
   return r.json();
 },
 async predict(file, conf = 0.25) {
   const fd = new FormData();
   fd.append('file', file);
   let r;
   try {
     r = await fetch(this.base() + `/api/predict?conf=${conf}`, {method: 'POST', body: fd});
   } catch (networkErr) {
     throw new Error(`Cannot reach backend at ${this.base()}. Please ensure the FastAPI server is running with 'python run.py'.`);
   }
   if (!r.ok) {
     let msg = `Prediction failed (HTTP ${r.status})`;
     try {
       const errJson = await r.json();
       if (errJson.detail) msg = typeof errJson.detail === 'string' ? errJson.detail : JSON.stringify(errJson.detail);
     } catch(e){}
     throw new Error(msg);
   }
   const j = await r.json();
   return {
     detections: (j.detections || []).map(d => {
       const p = d.fruit && d.maturity ? {fruit: d.fruit, maturity: d.maturity} : parseLabel(d.label || '');
       return {...p, label: d.label, confidence: d.confidence, box: d.box, class_id: d.class_id, iw: j.image_width, ih: j.image_height};
     }),
     image_width: j.image_width,
     image_height: j.image_height,
     inference_time_ms: j.inference_time_ms,
     annotated_image: j.annotated_image
   };
 },
 // Auth
 demoLogin: (role) => API.req('/api/auth/demo-login', {method: 'POST', body: JSON.stringify({role})}),
 login: (username_or_email, password) => API.req('/api/auth/login', {method: 'POST', body: JSON.stringify({username_or_email, password})}),
 register: (data) => API.req('/api/auth/register', {method: 'POST', body: JSON.stringify(data)}),
 me: () => API.req('/api/auth/me'),
 // Batches
 getBatches: (fruit, status) => API.req(`/api/batches?include_archived=false${fruit && fruit !== 'All' ? '&fruit='+fruit : ''}`),
 getBatch: (id) => API.req(`/api/batches/${id}`),
 createBatch: (data) => API.req('/api/batches', {method: 'POST', body: JSON.stringify(data)}),
 updateBatch: (id, data) => API.req(`/api/batches/${id}`, {method: 'PUT', body: JSON.stringify(data)}),
 addObservation: (id, formData) => API.req(`/api/batches/${id}/observations`, {method: 'POST', body: formData}),
 archiveBatch: (id) => API.req(`/api/batches/${id}`, {method: 'DELETE'}),
 // Marketplace
 getListings: (q, fruit, maturity) => {
   const p = new URLSearchParams();
   if (q) p.append('q', q);
   if (fruit && fruit !== 'All') p.append('fruit', fruit);
   if (maturity && maturity !== 'All') p.append('maturity', maturity);
   return API.req('/api/marketplace/listings?' + p.toString());
 },
 publishListing: (batchId, data) => API.req(`/api/marketplace/listings/${batchId}/publish`, {method: 'POST', body: JSON.stringify(data)}),
 updateListingStatus: (listingId, data) => API.req(`/api/marketplace/listings/${listingId}/status`, {method: 'PUT', body: JSON.stringify(data)}),
 // Purchase Requests
 submitRequest: (data) => API.req('/api/requests', {method: 'POST', body: JSON.stringify(data)}),
 getMyRequests: () => API.req('/api/requests/my'),
 getIncomingRequests: () => API.req('/api/requests/incoming'),
 updateRequestStatus: (reqId, status) => API.req(`/api/requests/${reqId}/status`, {method: 'PUT', body: JSON.stringify({status})}),
 // Messaging
 getMessages: (otherUserId, listingId, requestId) => {
   const p = new URLSearchParams();
   if (otherUserId) p.append('other_user_id', otherUserId);
   if (listingId) p.append('listing_id', listingId);
   if (requestId) p.append('request_id', requestId);
   return API.req('/api/messages?' + p.toString());
 },
 sendMessage: (data) => API.req('/api/messages', {method: 'POST', body: JSON.stringify(data)}),
 getInboxMessages: () => API.req('/api/messages/inbox'),
 getMessageThreads: () => API.req('/api/messages/threads'),
 getUnreadCount: () => API.req('/api/messages/unread-count'),
 markMessageRead: (msgId) => API.req(`/api/messages/${msgId}/read`, {method: 'PUT'}),
 // Admin
 getAdminListings: () => API.req('/api/admin/listings'),
 moderateListing: (id, suspend, reason) => API.req(`/api/admin/listings/${id}/moderate`, {method: 'POST', body: JSON.stringify({suspend, reason})}),
 getAuditLogs: () => API.req('/api/admin/audit-logs'),
 getAdminStats: () => API.req('/api/admin/stats')
};

function FruitArt({f, m='Ripe', size=110}){
 const c = FRUITS[f] ? FRUITS[f].c[STAGES.indexOf(m)] || '#8fc04a' : '#8fc04a';
 const id = 'g' + f + m + Math.random().toString(36).slice(2,5);
 return html`<svg width=${size} height=${size} viewBox="0 0 100 100" role="img" aria-label=${m+' '+f}>
 <defs><radialGradient id=${id} cx=".35" cy=".3"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".4" stop-color=${c}/><stop offset="1" stop-color=${c} stop-opacity=".85"/></radialGradient></defs>
 ${f==='Banana'?html`<path d="M18 30Q40 85 86 52Q60 90 14 50Z" fill=${'url(#'+id+')'} stroke=${c} stroke-width="4" stroke-linejoin="round"/>`

const DAY = 864e5;
const fmt = t => t ? new Date(t).toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'}) : '—';
const dom = o => {
 if(!o || !o.detections || !o.detections.length) return o && o.dominant_maturity ? o.dominant_maturity : null;
 const m = {};
 o.detections.forEach(d => { if(STAGES.includes(d.maturity)) m[d.maturity] = (m[d.maturity]||0) + d.confidence; });
 return Object.keys(m).sort((a,c) => m[c]-m[a])[0] || o.dominant_maturity || null;
};

function batchInfo(b) {
 const obs = b.observations || [];
 const last = obs[obs.length-1];
 const cur = dom(last) || b.confirmed_category;
 const prev = dom(obs[obs.length-2]);
 const next = last ? new Date(last.created_at).getTime() + (b.interval_days||7)*DAY : null;
 const due = !b.is_completed && next && Date.now() >= next;
 const review = !b.is_completed && !!(cur && prev && cur !== prev);
 const status = b.is_completed ? 'Completed' : due ? 'Inspection Due' : review ? 'Needs Review' : 'Monitoring';
 const why = due ? `Last inspected ${fmt(last ? last.created_at : null)}; your ${b.interval_days}-day inspection interval has passed.`
   : review ? `Latest classification was ${cur}, the previous one ${prev}. Prediction changed.` : '';
 return {last, cur, prev, next, due, review, status, why};
}

function Studio({init, batches=[], user, go, refreshBatches, switchRole}){
 const [img, setImg] = useState(null);
 const [file, setFile] = useState(null);
 const [dets, setDets] = useState([]);
 const [annotatedImg, setAnnotatedImg] = useState(null);
 const [viewMode, setViewMode] = useState('overlay'); // 'overlay' or 'annotated'
 const [busy, setBusy] = useState(false);
 const [hasAnalyzed, setHasAnalyzed] = useState(false);
 const [err, setErr] = useState('');
 const [cam, setCam] = useState(false);
 const [online, setOnline] = useState(null);
 const [dims, setDims] = useState(null);
 const [latency, setLatency] = useState(null);
 const [conf, setConf] = useState(0.25);
 const vid = useRef(), stream = useRef(), fin = useRef();

 // Batch Modal States
 const [showBatchModal, setShowBatchModal] = useState(false);
 const [batchTab, setBatchTab] = useState('existing'); // 'existing' or 'new'
 const [selectedBatchId, setSelectedBatchId] = useState('');
 const [obsNotes, setObsNotes] = useState('Visual observation recorded from AI Studio');
 const [modalBusy, setModalBusy] = useState(false);
 const [modalErr, setModalErr] = useState('');
 const [modalSuccess, setModalSuccess] = useState('');

 // New batch form states
 const [newBatch, setNewBatch] = useState({
   name: '',
   fruit: 'Mango',
   variety: '',
   plot: '',
   qty: 500,
   unit: 'kg',
   conf: 'Ripe',
   interval: 7,
   notes: 'Created from AI Studio observation'
 });

 const check = () => {
   API.health().then(res => setOnline(true)).catch(() => setOnline(false));
 };

 useEffect(() => { check(); return stopCam; }, []);
 useEffect(() => { if(init==='upload') fin.current && fin.current.click(); }, [init]);
 useEffect(() => { if(init==='camera') startCam(); }, [init]);

 useEffect(() => {
   if (batches && batches.length > 0 && !selectedBatchId) {
     setSelectedBatchId(batches[0].id);
   }
 }, [batches, selectedBatchId]);

 // Dominant fruit and maturity calculation from detections
 const dominantFruit = useMemo(() => {
   if (!dets || !dets.length) return 'Mango';
   const counts = {};
   dets.forEach(d => { if (d.fruit && d.fruit !== 'Unknown') counts[d.fruit] = (counts[d.fruit] || 0) + (d.confidence || 1); });
   const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
   return sorted[0] || 'Mango';
 }, [dets]);

 const dominantMaturity = useMemo(() => {
   if (!dets || !dets.length) return 'Ripe';
   const counts = {};
   dets.forEach(d => { if (STAGES.includes(d.maturity)) counts[d.maturity] = (counts[d.maturity] || 0) + (d.confidence || 1); });
   const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
   return sorted[0] || 'Ripe';
 }, [dets]);

 function openBatchModal() {
   setModalErr('');
   setModalSuccess('');
   setNewBatch({
     name: `${dominantFruit} Batch #${Math.floor(100 + Math.random() * 900)}`,
     fruit: dominantFruit,
     variety: '',
     plot: '',
     qty: 500,
     unit: 'kg',
     conf: dominantMaturity,
     interval: 7,
     notes: `Logged with ${dets.length} YOLOv8 detections (Visual maturity: ${dominantMaturity})`
   });
   if (batches && batches.length > 0) {
     setSelectedBatchId(batches[0].id);
     setBatchTab('existing');
   } else {
     setBatchTab('new');
   }
   setShowBatchModal(true);
 }

 async function saveToExisting() {
   if (!selectedBatchId) {
     setModalErr('Please select an existing batch.');
     return;
   }
   setModalBusy(true); setModalErr(''); setModalSuccess('');
   try {
     const fd = new FormData();
     if (file) fd.append('file', file);
     fd.append('notes', obsNotes || 'Visual observation recorded from AI Studio');
     fd.append('analysed', 'true');
     await API.addObservation(selectedBatchId, fd);
     if (refreshBatches) await refreshBatches();
     setModalSuccess('Observation successfully saved to batch!');
     setTimeout(() => {
       setShowBatchModal(false);
       if (go) go('batch-' + selectedBatchId);
     }, 600);
   } catch(e) {
     setModalErr(e.message || 'Failed to add observation to batch.');
   }
   setModalBusy(false);
 }

 async function saveNewBatch() {
   if (!newBatch.name.trim()) {
     setModalErr('Please enter a batch name.');
     return;
   }
   setModalBusy(true); setModalErr(''); setModalSuccess('');
   try {
     const created = await API.createBatch({
       name: newBatch.name.trim(),
       fruit: newBatch.fruit,
       variety: newBatch.variety,
       plot: newBatch.plot,
       qty: +newBatch.qty || 0,
       unit: newBatch.unit,
       confirmed_category: newBatch.conf,
       interval_days: +newBatch.interval || 7,
       notes: newBatch.notes
     });
     if (file) {
       const fd = new FormData();
       fd.append('file', file);
       fd.append('notes', `Initial inspection photograph (${dets.length} detection(s), ${newBatch.conf})`);
       fd.append('analysed', 'true');
       await API.addObservation(created.id, fd);
     }
     if (refreshBatches) await refreshBatches();
     setModalSuccess(`Batch '${created.name}' created successfully!`);
     setTimeout(() => {
       setShowBatchModal(false);
       if (go) go('batch-' + created.id);
     }, 600);
   } catch(e) {
     setModalErr(e.message || 'Failed to create new batch.');
   }
   setModalBusy(false);
 }

 function stopCam(){
   if(stream.current){ stream.current.getTracks().forEach(t=>t.stop()); stream.current=null; }
   setCam(false);
 }

 async function startCam(){
   setErr('');
   if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
     setErr('Camera is not supported in this browser context. Please upload a photo instead.');
     return;
   }
   try{
     const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
     stream.current = s;
     setCam(true);
     setTimeout(()=>{ if(vid.current) vid.current.srcObject = s; }, 50);
   } catch(e){
     setErr('Could not access camera ('+e.name+'). You can upload an image file instead.');
   }
 }

 function capture(){
   const v = vid.current;
   if(!v || !v.videoWidth) return;
   const c = document.createElement('canvas');
   c.width = v.videoWidth; c.height = v.videoHeight;
   c.getContext('2d').drawImage(v,0,0);
   c.toBlob(b => {
     const f = new File([b], 'camera_capture.jpg', {type: 'image/jpeg'});
     load(f);
     stopCam();
   }, 'image/jpeg', 0.92);
 }

 function load(f){
   if(!f) return;
   if(!f.type.startsWith('image/')){
     setErr('Unsupported image format: Please choose a valid image file (JPG, PNG, or WebP).');
     return;
   }
   if(f.size > 15 * 1024 * 1024){
     setErr(`File too large (${(f.size/1024/1024).toFixed(1)} MB): Upload limit is 15 MB. Please select a smaller photo.`);
     return;
   }
   setErr(''); setDets([]); setAnnotatedImg(null); setLatency(null); setHasAnalyzed(false);
   setFile(f);
   setImg(URL.createObjectURL(f));
 }

 function clearImage(){
   if(img && img.startsWith('blob:')){
     try { URL.revokeObjectURL(img); } catch(e){}
   }
   setFile(null);
   setImg(null);
   setDets([]);
   setAnnotatedImg(null);
   setDims(null);
   setLatency(null);
   setHasAnalyzed(false);
   setErr('');
   setViewMode('overlay');
   if(fin.current) fin.current.value = '';
 }

 async function analyze(){
   if(!file) return;
   setBusy(true); setErr(''); setDets([]); setAnnotatedImg(null);
   try {
     const res = await API.predict(file, conf);
     setDets(res.detections);
     setLatency(res.inference_time_ms);
     setAnnotatedImg(res.annotated_image || null);
     setHasAnalyzed(true);
     setOnline(true);
     if (window.__hlAdd) window.__hlAdd(res.detections, file.name);
   } catch(e) {
     setErr(e.message || 'Detection failed. Please verify the backend service is running.');
     setOnline(false);
   }
   setBusy(false);
 }

 const pos = d => {
   if(!d.box || !dims || !dims.w || !dims.h) return null;
   let [a,b,c,e] = d.box;
   const W = d.iw || dims.w, H = d.ih || dims.h;
   if(W <= 0 || H <= 0) return null;
   if(Math.max(a,b,c,e) > 1.5){
     a = (a / W) * 100;
     c = (c / W) * 100;
     b = (b / H) * 100;
     e = (e / H) * 100;
   } else {
     a = a * 100;
     c = c * 100;
     b = b * 100;
     e = e * 100;
   }
   return {
     left: `${a}%`,
     top: `${b}%`,
     width: `${Math.max(0, c - a)}%`,
     height: `${Math.max(0, e - b)}%`
   };
 };

 },[hist]);

 <div class="steps">${['Fruit & Name','Inventory & Schedule','Review & Save'].map((x,i)=>html`<span key=${x} class=${i===n?'on':''}>${i+1}. ${x}</span>`)}</div>
 <div class="card">
  ${n===0 && html`<div>
    <div class="fpick" role="group" aria-label="Fruit type">${FN.map(x=>html`<button key=${x} aria-pressed=${f.fruit===x} onClick=${()=>setF({...f,fruit:x})}><${FruitArt} f=${x} size=${52}/><br/>${x}</button>`)}</div>
    <div class="fg">
      <label class="f"><span>Batch name *</span><input value=${f.name} onInput=${u('name')} placeholder="e.g. Alphonso Mango Batch #01"/></label>
      <label class="f"><span>Variety (optional)</span><input value=${f.variety} onInput=${u('variety')} placeholder="e.g. Alphonso, Nagpur, Fuji"/></label>
      <label class="f"><span>Orchard / Plot</span><input value=${f.plot} onInput=${u('plot')} placeholder="e.g. North Ridge Plot 3"/></label>
    </div>
    <label class="f"><span>Notes</span><textarea rows="2" value=${f.notes} onInput=${u('notes')}></textarea></label>
  </div>`}

  ${n===1 && html`<div class="fg">
    <label class="f"><span>Batch Quantity *</span><input type="number" min="1" value=${f.qty} onInput=${u('qty')}/></label>
    <label class="f"><span>Unit</span><select value=${f.unit} onChange=${u('unit')}><option value="kg">kg</option><option value="tonnes">tonnes</option><option value="crates">crates</option></select></label>
    <label class="f"><span>Confirmed Maturity Category *</span>
      <select value=${f.conf} onChange=${u('conf')}>
        <option value="Unripe">Unripe</option>
        <option value="Ripe">Ripe</option>
        <option value="Overripe">Overripe</option>
        <option value="Rotten">Rotten</option>
      </select>
    </label>
    <label class="f"><span>Inspection Interval (days) *</span><input type="number" min="1" value=${f.interval} onInput=${u('interval')}/></label>
  </div>`}

  ${n===2 && html`<div>
    <p><b>Batch:</b> ${f.name} (${f.fruit}${f.variety?' · '+f.variety:''})</p>
    <p><b>Inventory:</b> ${f.qty} ${f.unit} · Confirmed Category: <b>${f.conf}</b></p>
    <p><b>Inspection Schedule:</b> Every ${f.interval} days</p>
    <p class="mu" style=${{fontSize:13}}>This batch will be saved securely in the backend database and remains private until you explicitly choose to publish it to the HarvestLens Exchange.</p>
  </div>`}

  ${e && html`<div class="ban err" role="alert">${e}</div>`}
  <div class="ctl">
    ${n>0 && html`<button class="btn ghost" onClick=${()=>setN(n-1)}>Back</button>`}
    ${n<2 ? html`<button class="btn dk" onClick=${()=>{ if(!f.name.trim()) return setE('Enter a batch name'); setE(''); setN(n+1); }}>Continue</button>`
    : html`<button class="btn dk" disabled=${busy} onClick=${save}>${busy?'Saving…':'Register Batch'}</button>`}
  </div>
 </div>
 </section>`;
}

function BatchDetail({b, go, onRefresh}){
 const [addObs, setAddObs] = useState(false);
 const [obsFile, setObsFile] = useState(null);
 const [obsNote, setObsNote] = useState('');
 const [busy, setBusy] = useState(false);
 const [err, setErr] = useState('');
 const [publishModal, setPublishModal] = useState(false);
 const [pubData, setPubData] = useState({
   title: b.name,
   region: 'Maharashtra',
   offered_qty: b.qty,
   price_per_unit: 100,
   currency: 'INR',
   description: ''
 });

 const i = batchInfo(b);

 async function saveObservation(){
   setBusy(true); setErr('');
   try {
     const fd = new FormData();
     if(obsFile) fd.append('file', obsFile);
     if(obsNote) fd.append('notes', obsNote);
     fd.append('analysed', 'true');
     await API.addObservation(b.id, fd);
     setAddObs(false); setObsFile(null); setObsNote('');
     if(onRefresh) onRefresh();
   } catch(e){
     setErr(e.message);
   }
   setBusy(false);
 }

 async function doPublish(){
   setBusy(true); setErr('');
   try {
     await API.publishListing(b.id, pubData);
     setPublishModal(false);
     if(onRefresh) onRefresh();
   } catch(e){
     setErr(e.message);
   }
   setBusy(false);
 }

 async function toggleStatus(status){
   if(!b.listing) return;
   try {
     await API.updateListingStatus(b.listing.id, {status});
     if(onRefresh) onRefresh();
   } catch(e){
     alert(e.message);
   }
 }

 return html`<section class="pg wrap">
 <button class="pill" onClick=${()=>go('batches')}>← All Batches</button>
 <h2 style=${{marginTop:12}}>${b.name}</h2>
 <p class="mu">${b.id} · ${b.fruit}${b.variety?' · '+b.variety:''}${b.plot?' · '+b.plot:''} · Created ${fmt(b.created_at)}</p>

 <div class="sum">
   <div class="card">Maturity Category<b style=${{fontSize:28}}>${b.confirmed_category||i.cur||'Unclassified'}</b></div>
   <div class="card">Available Inventory<b style=${{fontSize:26}}>${b.qty} ${b.unit}</b></div>
   <div class="card">Inspection Status<br/><span class=${'tag s-'+i.status.split(' ')[0]}>${i.status}</span></div>
   <div class="card">Marketplace<br/><span class="tag ${b.listing?'s-Monitoring':'demoTag'}">${b.listing ? b.listing.status.toUpperCase() : 'PRIVATE'}</span></div>
 </div>

 <div class="ctl">
   <button class="btn dk" onClick=${()=>setAddObs(!addObs)}>Add New Observation</button>
   ${!b.listing || b.listing.status==='draft' ? html`<button class="btn gold" onClick=${()=>setPublishModal(true)}>Publish on Exchange</button>`
   : html`<div style=${{display:'inline-flex',gap:8}}>
     ${b.listing.status==='published' ? html`<button class="btn ghost" onClick=${()=>toggleStatus('paused')}>Pause Listing</button>` : null}
     ${b.listing.status==='paused' ? html`<button class="btn dk" onClick=${()=>toggleStatus('published')}>Resume Listing</button>` : null}
     <button class="btn ghost" onClick=${()=>toggleStatus('soldout')}>Mark Sold Out</button>
   </div>`}
 </div>

 ${publishModal && html`<div class="modal-overlay"><div class="modal">
   <h3>Publish Batch on HarvestLens Exchange</h3>
   <p class="mu" style=${{fontSize:13}}>Only explicitly published batches appear to buyers. Your private internal notes remain protected.</p>
   <div class="fg">
     <label class="f"><span>Listing Title</span><input value=${pubData.title} onInput=${e=>setPubData({...pubData,title:e.target.value})}/></label>
     <label class="f"><span>Region / District</span><input value=${pubData.region} onInput=${e=>setPubData({...pubData,region:e.target.value})}/></label>
     <label class="f"><span>Offered Quantity (${b.unit})</span><input type="number" value=${pubData.offered_qty} onInput=${e=>setPubData({...pubData,offered_qty:+e.target.value})}/></label>
     <label class="f"><span>Asking Price (${pubData.currency} per ${b.unit})</span><input type="number" value=${pubData.price_per_unit} onInput=${e=>setPubData({...pubData,price_per_unit:+e.target.value})}/></label>
   </div>
   <label class="f" style=${{marginTop:10}}><span>Description</span><textarea rows="2" value=${pubData.description} onInput=${e=>setPubData({...pubData,description:e.target.value})}></textarea></label>
   ${err && html`<div class="ban err">${err}</div>`}
   <div class="ctl" style=${{marginTop:18}}>
     <button class="btn dk" disabled=${busy} onClick=${doPublish}>Confirm & Publish</button>
     <button class="btn ghost" onClick=${()=>setPublishModal(false)}>Cancel</button>
   </div>
 </div></div>`}

 ${addObs && html`<div class="card" style=${{marginTop:16}}>
   <h3>Record New Photograph & Inspection</h3>
   <p class="mu" style=${{fontSize:13}}>Upload a photo to automatically run YOLOv8 ripeness classification and log to history.</p>
   <div class="ctl">
     <input type="file" accept="image/*" onChange=${e=>setObsFile(e.target.files[0])}/>
   </div>
   <label class="f" style=${{marginTop:10}}><span>Farmer Notes</span><input value=${obsNote} onInput=${e=>setObsNote(e.target.value)} placeholder="e.g. Color deepening, excellent aroma, firmness check"/></label>
   ${err && html`<div class="ban err">${err}</div>`}
   <div class="ctl" style=${{marginTop:14}}>
     <button class="btn dk" disabled=${busy} onClick=${saveObservation}>${busy?'Analyzing & Saving…':'Save Observation'}</button>
     <button class="btn ghost" onClick=${()=>setAddObs(false)}>Cancel</button>
   </div>
 </div>`}

 <h3 style=${{marginTop:28}}>Observation Timeline</h3>
 ${!(b.observations && b.observations.length) ? html`<div class="empty">No observations recorded yet. Add your first photo above.</div>`
 : html`<div class="tl">${[...b.observations].reverse().map((o,k) => {
   const imgSrc = o.image_url ? (o.image_url.startsWith('http') ? o.image_url : API.base() + o.image_url) : null;
   return html`<div key=${k}>
     <b>${new Date(o.created_at).toLocaleString()}</b>
     ${o.dominant_maturity && html`<span class=${'tag t-'+o.dominant_maturity} style=${{marginLeft:8}}>${o.dominant_maturity}</span>`}
     ${imgSrc && html`<div style=${{margin:'8px 0'}}><img src=${imgSrc} alt="Observation photograph" style=${{maxHeight:220,borderRadius:12}}/></div>`}
     ${o.notes && html`<div style=${{fontSize:13,marginTop:4}}>📝 ${o.notes}</div>`}
     ${o.detections && o.detections.length>0 ? html`<div style=${{fontSize:12,marginTop:6,color:'var(--mu)'}}>Detections: ${o.detections.map(d=>`${d.fruit} ${d.maturity} (${Math.round(d.confidence*100)}%)`).join(', ')}</div>` : null}
   </div>`;
 })}</div>`}
 </section>`;
}

/* =========================================================================
   Notifications & Messages Component (Farmer & Buyer Inquiries)
   ========================================================================= */
function Notes({user, batches=[], onOpenChat, go, onRefreshUnread}){
  const [tab, setTab] = useState('all');
  const [messages, setMessages] = useState([]);
  const [requests, setRequests] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const isFarmer = !user || user.role === 'farmer' || user.role === 'admin';

  const load = useCallback(async () => {
    setBusy(true); setErr('');
    try {
      const isFarmer = !user || user.role === 'farmer' || user.role === 'admin';
      const [msgs, reqs] = await Promise.all([
        API.getInboxMessages().catch(() => []),
        (isFarmer ? API.getIncomingRequests() : API.getMyRequests()).catch(() => [])
      ]);
      setMessages(msgs || []);
      setRequests(reqs || []);
      if(onRefreshUnread) onRefreshUnread();
    } catch(e) {
      setErr(e.message || 'Failed to load notifications.');
    }
    setBusy(false);
  }, [user, onRefreshUnread]);

  useEffect(() => {
    load();
    const iv = setInterval(load, 5000);
    return () => clearInterval(iv);
  }, [load]);

  async function handleStatus(reqId, status) {
    try {
      await API.updateRequestStatus(reqId, status);
      await load();
    } catch(e) {
      alert(e.message || 'Failed to update request.');
    }
  }

  async function markRead(msgId) {
    try {
      await API.markMessageRead(msgId);
      setMessages(msgs => msgs.map(m => m.id === msgId ? {...m, is_read: true} : m));
      if(onRefreshUnread) onRefreshUnread();
    } catch(e){}
  }

  const batchAlerts = useMemo(() => {
    if (!isFarmer) return [];
    return (batches || []).map(b => {
      const info = batchInfo(b);
      return (info.due || info.review) ? {batch: b, info} : null;
    }).filter(Boolean);
  }, [batches, isFarmer]);

  const unreadMsgs = messages.filter(m => !m.is_read);
  const pendingReqs = requests.filter(r => r.status === 'Pending');

  return html`<section class="pg wrap">
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
      <div>
        <h2>${isFarmer ? 'Notifications & Buyer Messages' : 'Notifications & Seller Messages'}</h2>
        <p class="mu">${isFarmer
          ? 'Stay connected with buyers, review inquiries on your fruit batches, and process purchase proposals.'
          : 'Review messages and replies from fruit growers, track proposal updates, and stay connected with farmers.'}</p>
      </div>
      <button class="pill" onClick=${load} style=${{display:'inline-flex',gap:6,alignItems:'center'}}><${Ic} n="arrow" s=${14}/> Refresh</button>
    </div>

    <div class="filters" style=${{margin:'16px 0 24px'}}>
      <button class="pill" aria-pressed=${tab==='all'} onClick=${()=>setTab('all')}>
        All Notifications ${ (unreadMsgs.length + pendingReqs.length + batchAlerts.length) > 0 ? `(${unreadMsgs.length + pendingReqs.length + batchAlerts.length})` : '' }
      </button>
      <button class="pill" aria-pressed=${tab==='messages'} onClick=${()=>setTab('messages')}>
        <${Ic} n="message" s=${14}/> ${isFarmer ? 'Buyer Messages' : 'Farmer Messages'} ${unreadMsgs.length > 0 ? html`<span class="tag" style=${{marginLeft:6,background:'var(--y)',color:'var(--g)',fontSize:10}}><b>${unreadMsgs.length} new</b></span>` : `(${messages.length})`}
      </button>
      <button class="pill" aria-pressed=${tab==='proposals'} onClick=${()=>setTab('proposals')}>
        <${Ic} n="tag" s=${14}/> ${isFarmer ? 'Purchase Proposals' : 'My Proposals'} ${pendingReqs.length > 0 ? html`<span class="tag" style=${{marginLeft:6,background:'var(--v)',color:'var(--g)',fontSize:10}}><b>${pendingReqs.length} ${isFarmer ? 'action needed' : 'pending'}</b></span>` : `(${requests.length})`}
      </button>
      ${isFarmer && html`
        <button class="pill" aria-pressed=${tab==='alerts'} onClick=${()=>setTab('alerts')}>
          <${Ic} n="bell" s=${14}/> Batch Alerts ${batchAlerts.length > 0 ? `(${batchAlerts.length})` : ''}
        </button>
      `}
    </div>

    ${err && html`<div class="ban err">${err}</div>`}

    <!-- Messages Section (Buyer Inquiries for Farmer / Farmer Messages for Buyer) -->
    ${(tab === 'all' || tab === 'messages') && html`
      <div style=${{marginBottom:32}}>
        <h3 style=${{display:'flex',alignItems:'center',gap:8,margin:'0 0 14px'}}>
          <${Ic} n="message"/> ${isFarmer ? 'Incoming Buyer Inquiries & Chat Messages' : 'Messages & Replies from Farmers'}
          ${unreadMsgs.length > 0 && html`<span class="tag" style=${{background:'var(--y)',color:'var(--g)'}}>${unreadMsgs.length} Unread</span>`}
        </h3>

        ${!messages.length ? html`
          <div class="empty" style=${{padding:24}}>
            ${isFarmer
              ? 'No buyer messages received yet. When buyers message you from the HarvestLens Exchange, they will appear here.'
              : 'No messages received yet. When farmers message you or reply to your inquiries, they will appear here.'}
          </div>
        ` : html`
          <div style=${{display:'grid',gap:12}}>
            ${messages.map(m => html`
              <div key=${m.id} class="card" style=${{
                borderLeft: m.is_read ? '4px solid var(--bd)' : '4px solid var(--y)',
                background: m.is_read ? 'var(--card)' : 'rgba(231,185,85,0.06)'
              }}>
                <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
                  <div style=${{display:'flex',alignItems:'center',gap:10}}>
                    <div style=${{
                      width:38,height:38,borderRadius:'50%',background:'var(--g)',color:'#fff',
                      display:'grid',placeItems:'center',fontWeight:800,fontSize:15
                    }}>
                      ${(m.sender_name || 'U').charAt(0).toUpperCase()}
                    </div>
                    <div>
                      <div style=${{display:'flex',alignItems:'center',gap:8}}>
                        <b>${m.sender_name}</b>
                        <span class="tag" style=${{background:'var(--bd)',color:'var(--tx)',fontSize:10}}>${isFarmer ? 'Buyer' : 'Farmer / Seller'}</span>
                        ${!m.is_read && html`<span class="tag" style=${{background:'var(--y)',color:'var(--g)',fontSize:10}}>New Message</span>`}
                      </div>
                      ${m.listing_title && html`
                        <div class="mu" style=${{fontSize:12,marginTop:2}}>
                          Regarding listing: <b>${m.listing_title}</b> ${m.fruit ? `(${m.fruit})` : ''}
                        </div>
                      `}
                    </div>
                  </div>
                  <div style=${{fontSize:12,color:'var(--mu)'}}>
                    ${new Date(m.created_at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
                  </div>
                </div>

                <div style=${{marginTop:12,padding:'10px 14px',background:'var(--bg)',borderRadius:10,fontSize:14,lineHeight:1.6,color:'var(--tx)',whiteSpace:'pre-line'}}>
                  ${m.content}
                </div>

                <div class="ctl" style=${{marginTop:12,justifyContent:'flex-end'}}>
                  ${!m.is_read && html`
                    <button class="btn ghost" style=${{padding:'7px 14px',fontSize:12}} onClick=${()=>markRead(m.id)}>
                      Mark Read
                    </button>
                  `}
                  <button class="btn dk" style=${{padding:'7px 16px',fontSize:12}} onClick=${()=>{
                    if(!m.is_read) markRead(m.id);
                    onOpenChat(m.sender_id, m.listing_id, m.sender_name);
                  }}>
                    <${Ic} n="message" s=${14}/> Reply in Chat
                  </button>
                </div>
              </div>
            `)}
          </div>
        `}
      </div>
    `}

    <!-- Purchase Proposals Section -->
    ${(tab === 'all' || tab === 'proposals') && html`
      <div style=${{marginBottom:32}}>
        <h3 style=${{display:'flex',alignItems:'center',gap:8,margin:'0 0 14px'}}>
          <${Ic} n="tag"/> ${isFarmer ? 'Incoming Purchase Proposals' : 'My Purchase Proposals'}
          ${pendingReqs.length > 0 && html`<span class="tag" style=${{background:'var(--v)',color:'var(--g)'}}>${pendingReqs.length} ${isFarmer ? 'Action Needed' : 'Pending'}</span>`}
        </h3>

        ${!requests.length ? html`
          <div class="empty" style=${{padding:24}}>
            ${isFarmer
              ? 'No purchase proposals received yet. Buyers on the HarvestLens Exchange can propose orders on your published fruit batches.'
              : 'No purchase proposals submitted yet. Browse the HarvestLens Exchange to find quality batches and submit offers.'}
          </div>
        ` : html`
          <div style=${{display:'grid',gap:12}}>
            ${requests.map(r => html`
              <div key=${r.id} class="card" style=${{
                borderLeft: r.status === 'Pending' ? '4px solid var(--v)' : '4px solid var(--bd)'
              }}>
                <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
                  <div>
                    <div style=${{display:'flex',alignItems:'center',gap:8}}>
                      <b>Proposal #${r.id}</b>
                      <span class=${'tag ' + (r.status==='Accepted'?'s-Monitoring':r.status==='Rejected'?'s-Needs':'s-Inspection')}>
                        ${r.status}
                      </span>
                    </div>
                    <div style=${{fontSize:13,marginTop:4}}>
                      ${isFarmer
                        ? html`Buyer: <b>${r.buyer_name}</b> for listing: <b>${r.listing_title || r.fruit}</b>`
                        : html`Seller: <b>${r.seller_name || 'Farmer'}</b> for listing: <b>${r.listing_title || r.fruit}</b>`}
                    </div>
                  </div>
                  <div style=${{fontSize:12,color:'var(--mu)'}}>
                    ${new Date(r.created_at).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}
                  </div>
                </div>

                <div class="fg" style=${{margin:'12px 0 8px'}}>
                  <div class="card" style=${{background:'var(--bd)',padding:'10px 14px',boxShadow:'none'}}>
                    <span class="mu" style=${{fontSize:11}}>Requested Quantity</span>
                    <div style=${{fontSize:16,fontWeight:800}}>${r.quantity} ${r.unit}</div>
                  </div>
                  <div class="card" style=${{background:'var(--bd)',padding:'10px 14px',boxShadow:'none'}}>
                    <span class="mu" style=${{fontSize:11}}>Proposed Price</span>
                    <div style=${{fontSize:16,fontWeight:800}}>INR ${r.proposed_price.toFixed(2)} / ${r.unit}</div>
                  </div>
                  <div class="card" style=${{background:'var(--bd)',padding:'10px 14px',boxShadow:'none'}}>
                    <span class="mu" style=${{fontSize:11}}>Total Value</span>
                    <div style=${{fontSize:16,fontWeight:800,color:'var(--lf)'}}>INR ${(r.quantity * r.proposed_price).toFixed(2)}</div>
                  </div>
                </div>

                ${r.message && html`
                  <div style=${{margin:'8px 0',fontSize:13,color:'var(--mu)',whiteSpace:'pre-line'}}>
                    Note: <i>“${r.message}”</i>
                  </div>
                `}

                <div class="ctl" style=${{marginTop:12,justifyContent:'space-between',alignItems:'center'}}>
                  <button class="btn ghost" style=${{padding:'7px 14px',fontSize:12,display:'inline-flex',gap:6,alignItems:'center'}} onClick=${()=>onOpenChat(isFarmer ? r.buyer_id : r.farmer_id, r.listing_id, isFarmer ? r.buyer_name : (r.seller_name || 'Farmer'))}>
                    <${Ic} n="message" s=${14}/> ${isFarmer ? 'Chat with Buyer' : 'Chat with Seller'}
                  </button>

                  ${isFarmer && r.status === 'Pending' && html`
                    <div style=${{display:'flex',gap:8}}>
                      <button class="btn dk" style=${{padding:'7px 16px',fontSize:12}} onClick=${()=>handleStatus(r.id, 'Accepted')}>
                        Accept Proposal
                      </button>
                      <button class="btn ghost" style=${{padding:'7px 14px',fontSize:12}} onClick=${()=>handleStatus(r.id, 'Rejected')}>
                        Decline
                      </button>
                    </div>
                  `}
                </div>
              </div>
            `)}
          </div>
        `}
      </div>
    `}

    <!-- Batch Alerts Section (Farmer only) -->
    ${isFarmer && (tab === 'all' || tab === 'alerts') && html`
      <div>
        <h3 style=${{display:'flex',alignItems:'center',gap:8,margin:'0 0 14px'}}>
          <${Ic} n="bell"/> Batch Inspection & Ripeness Alerts
        </h3>
        ${!batchAlerts.length ? html`
          <div class="empty" style=${{padding:24}}>
            All batches are up-to-date with their inspection schedules.
          </div>
        ` : html`
          <div style=${{display:'grid',gap:12}}>
            ${batchAlerts.map(({batch: b, info}) => html`
              <div key=${b.id} class="card" style=${{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
                <div>
                  <div style=${{display:'flex',alignItems:'center',gap:8}}>
                    <b>${b.name}</b>
                    <span class=${'tag s-' + info.status.split(' ')[0]}>${info.status}</span>
                    ${info.cur && html`<span class=${'tag t-' + info.cur}>${info.cur}</span>`}
                  </div>
                  <p class="mu" style=${{fontSize:13,margin:'4px 0 0'}}>${info.why}</p>
                </div>
                <button class="btn dk" style=${{padding:'8px 16px',fontSize:12}} onClick=${()=>go('batch-' + b.id)}>
                  Inspect Batch
                </button>
              </div>
            `)}
          </div>
        `}
      </div>
    `}
  </section>`;
}

function Market({user, onOpenChat}){
 const [q,setQ]=useState(''); const [f,setF]=useState('All'); const [m,setM]=useState('All');
 const [listings,setListings]=useState([]);
 const [sel,setSel]=useState(null);
 const [rf,setRf]=useState({qty:100, price:80, msg:''});
 const [busy,setBusy]=useState(false);
 const [err,setErr]=useState('');
 const [done,setDone]=useState('');

 const load = useCallback(async () => {
   try {
     const data = await API.getListings(q, f, m);
     setListings(data);
   } catch(e){
     setErr(e.message);
   }
 }, [q, f, m]);

 useEffect(() => { load(); }, [load]);

 const b = sel && listings.find(x => x.id === sel);

 async function sendRequest(){
   if(!user){ setErr('Please sign in as a Buyer to submit purchase proposals.'); return; }
   if(user.role !== 'buyer' && user.role !== 'admin'){ setErr('Purchase proposals must be submitted from a Buyer account.'); return; }
   if(!b) return;
   setBusy(true); setErr(''); setDone('');
   try {
     await API.submitRequest({
       listing_id: b.id,
       quantity: +rf.qty,
       proposed_price: +rf.price,
       message: rf.msg
     });
     setDone('Purchase request submitted successfully. The farmer will be notified.');
     setRf({qty:100, price:80, msg:''});
     load();
   } catch(e){
     setErr(e.message);
   }
   setBusy(false);
 }

 return html`<section class="pg wrap">
 <h2>HarvestLens Exchange</h2>
 <p class="mu">Agricultural marketplace connecting fruit growers directly with commercial buyers. Only explicitly published batches appear here.</p>
 
 <div class="fg">
   <label class="f"><span>Search</span><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Title, variety, region..."/></label>
   <label class="f"><span>Fruit</span><select value=${f} onChange=${e=>setF(e.target.value)}><option>All</option>${FN.map(x=>html`<option key=${x}>${x}</option>`)}</select></label>
   <label class="f"><span>Confirmed Maturity</span><select value=${m} onChange=${e=>setM(e.target.value)}><option>All</option>${STAGES.map(x=>html`<option key=${x}>${x}</option>`)}</select></label>
 </div>

 ${!listings.length ? html`<div class="empty">No published listings currently match your filter criteria.</div>`
 : html`<div class="grid">${listings.map(l => html`<article class="card fc" key=${l.id}>
   ${l.latest_image_url ? html`<img class="thumb" src=${l.latest_image_url.startsWith('http') ? l.latest_image_url : API.base() + l.latest_image_url} alt="Listing Photo"/>`
   : html`<div class="thumb"><${FruitArt} f=${l.fruit} m=${l.confirmed_category} size=${90}/></div>`}
   <h3 style=${{margin:'0 0 4px'}}>${l.title}</h3>
   <span class=${'tag t-'+l.confirmed_category}>${l.confirmed_category}</span>
   <p style=${{fontSize:14,margin:'8px 0'}}>
     ${l.fruit}${l.variety?' · '+l.variety:''} · ${l.region}<br/>
     Available: <b>${l.available_qty} ${l.unit}</b> (Offered: ${l.offered_qty} ${l.unit})<br/>
     Price: <b>${l.currency} ${l.price_per_unit} / ${l.unit}</b><br/>
     <span class="mu">${l.farm_name || 'Verified Grower'}</span>
   </p>
   <div style=${{display:'flex',gap:8,marginTop:'auto',width:'100%'}}>
     <button class="btn dk" style=${{flex:1,padding:'8px 10px',fontSize:13}} onClick=${()=>{setSel(l.id); setErr(''); setDone('');}}>Inspect & Propose</button>
     <button class="btn ghost" style=${{padding:'8px 12px',fontSize:13,display:'inline-flex',gap:6,alignItems:'center'}} title="Chat with Farmer" onClick=${()=>onOpenChat(l.farmer_id, l.id, l.farm_name || 'Grower')}>
       <${Ic} n="message" s=${14}/> Chat
     </button>
   </div>
 </article>`)}</div>`}

 ${b && html`<div class="card" style=${{marginTop:24}}>
   <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
     <h3 style=${{marginTop:0}}>${b.title}</h3>
     <button class="pill" onClick=${()=>setSel(null)}>Close</button>
   </div>
   <p style=${{fontSize:14}}>
     <b>Fruit:</b> ${b.fruit} (${b.variety || 'Standard Variety'}) · <b>Maturity:</b> <span class=${'tag t-'+b.confirmed_category}>${b.confirmed_category}</span><br/>
     <b>Region:</b> ${b.region} · <b>Available Stock:</b> ${b.available_qty} ${b.unit}<br/>
     <b>Farmer:</b> ${b.farm_name || 'Independent Farmer'}
   </p>
   ${b.description && html`<p class="mu" style=${{fontSize:14}}>${b.description}</p>`}
   
   <div class="fg" style=${{marginTop:14}}>
     <label class="f"><span>Proposal Quantity (${b.unit})</span><input type="number" max=${b.available_qty} value=${rf.qty} onInput=${e=>setRf({...rf,qty:e.target.value})}/></label>
     <label class="f"><span>Proposed Unit Price (${b.currency})</span><input type="number" value=${rf.price} onInput=${e=>setRf({...rf,price:e.target.value})}/></label>
     <label class="f"><span>Inquiry Note</span><input value=${rf.msg} onInput=${e=>setRf({...rf,msg:e.target.value})} placeholder="e.g. Schedule logistics, sample request"/></label>
   </div>
   
   ${err && html`<div class="ban err">${err}</div>`}
   ${done && html`<div class="ban ok">${done}</div>`}
   <div class="ctl" style=${{marginTop:16}}>
     <button class="btn dk" disabled=${busy} onClick=${sendRequest}>${busy?'Submitting…':'Submit Purchase Proposal'}</button>
     <button class="btn ghost" onClick=${()=>onOpenChat(b.farmer_id, b.id, b.farm_name || 'Seller')}><${Ic} n="message"/> Message Seller</button>
   </div>
 </div>`}
 </section>`;
}

function MyReq({onOpenChat}){
 const [reqs, setReqs] = useState([]);
 const [err, setErr] = useState('');

 const load = useCallback(async () => {
   try { setReqs(await API.getMyRequests()); } catch(e){ setErr(e.message); }
 }, []);

 useEffect(() => { load(); }, [load]);

 async function cancel(id){
   try {
     await API.updateRequestStatus(id, 'Cancelled');
     load();
   } catch(e){ alert(e.message); }
 }

 return html`<section class="pg wrap">
 <h2>My Purchase Requests</h2>
 <p class="mu">Track your proposals, price offers, and acceptance statuses from fruit growers.</p>
 ${err && html`<div class="ban err">${err}</div>`}
 ${!reqs.length ? html`<div class="empty">No active purchase proposals. Browse the Exchange to place an order.</div>`
 : reqs.map(r => html`<div class="card" key=${r.id} style=${{marginBottom:12}}>
   <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
     <b>${r.listing_title || r.id}</b>
     <span class="tag ${r.status==='Accepted'?'s-Monitoring':r.status==='Rejected'?'s-Needs':'s-Inspection'}">${r.status}</span>
   </div>
   <p style=${{fontSize:14,margin:'6px 0'}}>
     Seller: <b>${r.seller_name || 'Farmer'}</b> · Quantity: <b>${r.quantity} ${r.unit||'kg'}</b> · Offered: <b>INR ${r.proposed_price}/${r.unit||'kg'}</b> · Date: ${fmt(r.created_at)}
   </p>
   ${r.message && html`<div class="mu" style=${{fontSize:13,whiteSpace:'pre-line'}}>Note: "${r.message}"</div>`}
   <div class="ctl" style=${{marginTop:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
     ${r.farmer_id && onOpenChat ? html`
       <button class="btn ghost" style=${{fontSize:12,padding:'6px 14px',display:'inline-flex',gap:6,alignItems:'center'}} onClick=${()=>onOpenChat(r.farmer_id, r.listing_id, r.seller_name || 'Farmer')}>
         <${Ic} n="message" s=${14}/> Chat with Seller
       </button>
     ` : html`<div></div>`}
     ${r.status === 'Pending' ? html`<button class="btn ghost" style=${{fontSize:12,padding:'6px 14px',color:'var(--rd)'}} onClick=${()=>cancel(r.id)}>Cancel Proposal</button>` : null}
   </div>
 </div>`)}
 </section>`;
}

function Admin(){

 const [why, setWhy] = useState({});
 const [stats, setStats] = useState(null);
 const [err, setErr] = useState('');

 const load = useCallback(async () => {
   try {
     setListings(await API.getAdminListings());
     setStats(await API.getAdminStats());
   } catch(e){ setErr(e.message); }
 }, []);

 useEffect(() => { load(); }, [load]);

   try {
     await API.moderateListing(id, suspend, reason);
     load();
   } catch(e){ alert(e.message); }
 }

 return html`<section class="pg wrap">
 <h2>Marketplace Moderation Panel</h2>

 ${stats && html`<div class="sum">
   <div class="card">Registered Users<b>${stats.users_count}</b></div>
   <div class="card">Total Batches<b>${stats.batches_count}</b></div>
   <div class="card">Active Listings<b>${stats.active_listings_count}</b></div>
   <div class="card">Suspended<b>${stats.suspended_listings_count}</b></div>
 </div>`}
 ${err && html`<div class="ban err">${err}</div>`}
 <div style=${{overflowX:'auto',marginTop:16}}>
   <table style=${{width:'100%',borderCollapse:'collapse',fontSize:13}}>
     <thead>

     </thead>
     <tbody>
       ${listings.map(l => html`<tr key=${l.id} style=${{borderBottom:'1px solid var(--bd)'}}>
         <td style=${{padding:8}}>${l.id}</td>
         <td>${l.batch_id}</td>
         <td>${l.fruit}</td>

         <td>INR ${l.price_per_unit}</td>

         <td>

 </div>
 </section>`;
}

/* =========================================================================
   Direct Messaging Drawer / Modal
   ========================================================================= */
function ChatModal({target, onClose, user}){
 const [msgs, setMsgs] = useState([]);
 const [text, setText] = useState('');
 const [busy, setBusy] = useState(false);
 const boxRef = useRef(null);

 const load = useCallback(async () => {
   if(!target || !target.userId) return;
   try {
     const res = await API.getMessages(target.userId, target.listingId);
     setMsgs(res || []);
   } catch(e){}
 }, [target]);

 useEffect(() => {
   load();
   const iv = setInterval(load, 3000);
   return () => clearInterval(iv);
 }, [load]);

 useEffect(() => {
   if (boxRef.current) {
     boxRef.current.scrollTop = boxRef.current.scrollHeight;
   }
 }, [msgs]);

 async function send(){
   if(!text.trim()) return;
   setBusy(true);
   try {
     await API.sendMessage({
       receiver_id: target.userId,
       listing_id: target.listingId,
       content: text.trim()
     });
     setText('');
     await load();
   } catch(e){ alert(e.message); }
   setBusy(false);
 }

 const myId = user ? user.id : null;

 return html`<div class="modal-overlay"><div class="modal">
   <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
     <h3 style=${{margin:0,display:'flex',alignItems:'center',gap:8}}><${Ic} n="message"/> Chat with ${target.name || 'User'}</h3>
     <button class="pill" onClick=${onClose}>Close</button>
   </div>
   <div class="chat-box" ref=${boxRef}>
     ${!msgs.length ? html`<div class="mu" style=${{textAlign:'center',padding:20}}>Start conversation regarding this fruit batch…</div>`
     : msgs.map(m => html`<div key=${m.id} class=${'chat-msg ' + (m.sender_id === myId ? 'mine' : 'theirs')}>
       <div style=${{whiteSpace:'pre-line'}}>${m.content}</div>
       <div style=${{fontSize:10,opacity:.7,marginTop:2}}>${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
     </div>`)}
   </div>
   <div style=${{display:'flex',gap:8}}>
     <input type="text" value=${text} onInput=${e=>setText(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()} placeholder="Type message…"/>
     <button class="btn dk" disabled=${busy} onClick=${send}>Send</button>
   </div>
 </div></div>`;
}

/* =========================================================================
   User Authentication Modal (Sign In / Sign Up)
   ========================================================================= */
function AuthModal({onClose, onLoggedIn}){
 const [mode, setMode] = useState('login'); // 'login' or 'register'
 const [role, setRole] = useState('farmer');
 const [username, setUsername] = useState('');
 const [email, setEmail] = useState('');
 const [password, setPassword] = useState('');
 const [fullName, setFullName] = useState('');
 const [farmName, setFarmName] = useState('');
 const [err, setErr] = useState('');
 const [busy, setBusy] = useState(false);

 async function submit(){
   setBusy(true); setErr('');
   try {
     let res;
     if (mode === 'login') {
       res = await API.login(username || email, password);
     } else {
       res = await API.register({
         username, email, password, full_name: fullName, role, farm_name: farmName
       });
     }
     API.setToken(res.access_token);
     onLoggedIn(res);
     onClose();
   } catch(e){
     setErr(e.message);
   }
   setBusy(false);
 }

 return html`<div class="modal-overlay"><div class="modal">
   <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
     <h3 style=${{margin:0}}>${mode==='login'?'Sign In to HarvestLens AI':'Create HarvestLens Account'}</h3>
     <button class="pill" onClick=${onClose}>Close</button>
   </div>
   <div class="filters" style=${{margin:'14px 0'}}>
     <button class="pill" aria-pressed=${mode==='login'} onClick=${()=>setMode('login')}>Sign In</button>
     <button class="pill" aria-pressed=${mode==='register'} onClick=${()=>setMode('register')}>Register</button>
   </div>
   <div class="fg" style=${{gap:10}}>
     ${mode === 'register' && html`
       <label class="f"><span>Account Role</span>
         <select value=${role} onChange=${e=>setRole(e.target.value)}>
           <option value="farmer">Farmer (Producer)</option>
           <option value="buyer">Buyer (Wholesale / Retail)</option>
           <option value="admin">Platform Administrator</option>
         </select>
       </label>
       <label class="f"><span>Full Name</span><input value=${fullName} onInput=${e=>setFullName(e.target.value)}/></label>
       <label class="f"><span>Email</span><input type="email" value=${email} onInput=${e=>setEmail(e.target.value)}/></label>
     `}
     <label class="f"><span>Username</span><input value=${username} onInput=${e=>setUsername(e.target.value)} placeholder="Username or email"/></label>
     <label class="f"><span>Password</span><input type="password" value=${password} onInput=${e=>setPassword(e.target.value)}/></label>
     ${mode === 'register' && role === 'farmer' && html`
       <label class="f"><span>Farm / Orchard Name</span><input value=${farmName} onInput=${e=>setFarmName(e.target.value)} placeholder="e.g. Golden Harvest Orchard"/></label>
     `}
   </div>
   ${err && html`<div class="ban err">${err}</div>`}
   <div class="ctl" style=${{marginTop:18}}>
     <button class="btn dk" disabled=${busy} onClick=${submit}>${busy?'Processing…':(mode==='login'?'Sign In':'Create Account')}</button>
     <button class="btn ghost" onClick=${onClose}>Cancel</button>
   </div>
 </div></div>`;
}

/* =========================================================================
   Main Application Root
   ========================================================================= */
function App(){
 const PG = ['home','studio','farm','batches','register','notes','explorer','analytics','about','market','myreq','admin','audit'];
 const get = () => {
   const h = (location.hash||'#home').slice(1);
   return PG.includes(h) || h.startsWith('batch-') ? h : 'home';
 };

 const [page, setPage] = useState(get());
 const [init, setInit] = useState(null);
 const [hist, setHist] = useState([]);
 const [batches, setBatches] = useState([]);
 const [user, setUser] = useState(null);
 const [chatTarget, setChatTarget] = useState(null);
 const [showAuth, setShowAuth] = useState(false);
 const [sidebarOpen, setSidebarOpen] = useState(false);
 const [unreadCount, setUnreadCount] = useState(0);

 const fetchUnread = useCallback(async () => {
   try {
     const u = await API.getUnreadCount();
     setUnreadCount(u.total_unread || 0);
   } catch(e){}
 }, []);

 const fetchUser = useCallback(async () => {
   try {
     const me = await API.me();
     setUser(me);
   } catch(e){
     // Automatically demo-login as farmer if no token exists
     const demo = await API.demoLogin('farmer');
     API.setToken(demo.access_token);
     setUser({id: demo.user_id, username: demo.username, email: demo.email, role: demo.role, farm_name: demo.farm_name});
   }
 }, []);

 const fetchBatches = useCallback(async () => {
   try {
     const data = await API.getBatches();
     setBatches(data);
   } catch(e){}
 }, []);

 useEffect(() => {
   fetchUser();
   fetchBatches();
   fetchUnread();
   const iv = setInterval(fetchUnread, 6000);
   window.__hlAdd = (dets, name) => setHist(h => [...h, {dets, name, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}]);
   return () => clearInterval(iv);
 }, [fetchUser, fetchBatches, fetchUnread]);

 const switchRole = async (targetRole) => {
   try {
     const demo = await API.demoLogin(targetRole);
     API.setToken(demo.access_token);
     setUser({id: demo.user_id, username: demo.username, email: demo.email, role: demo.role, farm_name: demo.farm_name});
     fetchBatches();
     fetchUnread();
     go('home');
   } catch(e){
     alert('Could not switch role: ' + e.message);
   }
 };

 const go = (p, i) => {
   setInit(i || null);
   setPage(p);
   try { history.replaceState(null, '', '#' + p); } catch(e){}
   window.scrollTo({top: 0, behavior: 'smooth'});
 };

 const curBatch = page.startsWith('batch-') && batches.find(b => b.id === page.slice(6));

 return html`<div class="app-layout">
  <${TopNav} go=${go} user=${user} switchRole=${switchRole} onOpenAuth=${()=>setShowAuth(true)} onToggleSidebar=${()=>setSidebarOpen(!sidebarOpen)} sidebarOpen=${sidebarOpen} unreadCount=${unreadCount}/>

  <div class="app-shell">
    <${Sidebar} page=${page.startsWith('batch-')?'batches':page} go=${go} user=${user} open=${sidebarOpen} onClose=${()=>setSidebarOpen(false)} unreadCount=${unreadCount}/>
    ${sidebarOpen && html`<div class="sidebar-backdrop" onClick=${()=>setSidebarOpen(false)}></div>`}

    <div class="app-main-wrap">
      <main>
        ${page === 'home' && html`<${Home} go=${go} count=${hist.length}/>`}
        ${page === 'studio' && html`<${Studio} key=${init+'s'} init=${init} batches=${batches} user=${user} go=${go} refreshBatches=${fetchBatches} switchRole=${switchRole}/>`}
        ${page === 'farm' && html`<${Farm} batches=${batches} go=${go} refresh=${fetchBatches}/>`}
        ${page === 'batches' && html`<${Batches} batches=${batches} go=${go}/>`}
        ${page === 'register' && html`<${Register} go=${go} onCreated=${fetchBatches}/>`}
        ${page === 'notes' && html`<${Notes} user=${user} batches=${batches} onOpenChat=${(userId, listingId, name)=>setChatTarget({userId, listingId, name})} go=${go} onRefreshUnread=${fetchUnread}/>`}
        ${page === 'explorer' && html`<${Explorer}/>`}
        ${page === 'analytics' && html`<${Analytics} hist=${hist}/>`}
        ${page === 'about' && html`<${About}/>`}
        ${page === 'market' && html`<${Market} user=${user} onOpenChat=${(userId, listingId, name)=>setChatTarget({userId, listingId, name})}/>`}
        ${page === 'myreq' && html`<${MyReq} onOpenChat=${(userId, listingId, name)=>setChatTarget({userId, listingId, name})}/>`}
        ${page === 'admin' && html`<${Admin}/>`}
        ${page === 'audit' && html`<${Audit}/>`}
        ${curBatch && html`<${BatchDetail} key=${curBatch.id} b=${curBatch} go=${go} onRefresh=${fetchBatches}/>`}
      </main>

      
    </div>
  </div>

  <button class="btn dk fab" aria-label="Open camera" onClick=${()=>go('studio','camera')}><${Ic} n="camera" s=${24}/></button>

  ${chatTarget && html`<${ChatModal} target=${chatTarget} onClose=${()=>setChatTarget(null)} user=${user}/>`}
  ${showAuth && html`<${AuthModal} onClose=${()=>setShowAuth(false)} onLoggedIn=${(u)=>{ setUser(u); fetchBatches(); }}/>`}
 </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
